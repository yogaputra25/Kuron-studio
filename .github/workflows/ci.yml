name: ci

on:
  push:
    paths:
      - "kuron-studio/**"
  pull_request:
    paths:
      - "kuron-studio/**"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kuron-studio
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: kuron-studio/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kuron-studio/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kuron-studio/src-tauri -> target
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings

  # M4-8: build matrix — installer artifacts (.msi/.dmg/.deb) per OS.
  build:
    needs: [frontend, rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ""
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: kuron-studio
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: kuron-studio/pnpm-lock.yaml
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: kuron-studio
          args: ${{ matrix.args }}
      # M4-7 signing: set TAURI_SIGNING_PRIVATE_KEY + TAURI_SIGNING_PRIVATE_KEY_PASSWORD
      # secrets, and replace the M4-PLACEHOLDER pubkey in tauri.conf.json —
      # then uncomment updaterArtifacts below to attach .sig files.
      # - uses: actions/upload-artifact@v4
      #   with:
      #     name: updater-${{ matrix.os }}
      #     path: kuron-studio/src-tauri/target/**/bundle/
