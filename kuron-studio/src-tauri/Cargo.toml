[package]
name = "kuron-studio"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Kuron Studio — Manga Translation Workbench (Tauri v2)"

[lib]
name = "kuron_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
zip = "2"
