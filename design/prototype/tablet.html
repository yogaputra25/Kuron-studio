<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T · Tablet — Kuron Studio</title>
<link rel="stylesheet" href="tokens.css">
</head>
<body>
<div class="app">
  <div class="tablet">
    <div class="appbar">
      <span class="btn gho sm">=</span>
      <span class="brand">Kuron Studio</span>
      <span class="count tnum">Ch 12 · 007/182</span>
      <span class="sp"></span>
      <span class="btn def sm" style="height:44px">Detect</span>
      <span class="btn def sm" style="height:44px">Review</span>
    </div>
    <div class="tbody">
      <div class="rail">
        <div class="ric">L</div><span class="rl">Lib</span>
        <div class="ric on">G</div><span class="rl">Grid</span>
        <div class="ric">C</div><span class="rl">Ch</span>
        <div class="ric">S</div><span class="rl">Set</span>
      </div>
      <div class="tmain">
        <p class="note" style="margin:0;font-size:12px;color:var(--ks-text-3)">Rail ikon: tap = overlay sementara · Grid 3 kolom · panel jadi bottom-sheet</p>
        <div class="tcards">
          <div class="pcard"><div class="ov"><span class="chip">5</span></div><div class="mg"><i class="p"></i><i class="p"></i><i class="d"></i><i class="b"></i></div><div class="foot"><span class="nm">p007.jpg</span><span class="badge ok">Done</span></div></div>
          <div class="pcard"><div class="ov"><span class="chip">3</span></div><div class="mg"><i class="p"></i><i class="p"></i><i class="d"></i><i class="b"></i></div><div class="foot"><span class="nm">p008.jpg</span><span class="badge run">Translating</span></div></div>
          <div class="pcard"><div class="ov"><span class="chip">6</span></div><div class="mg"><i class="p"></i><i class="p"></i><i class="d"></i><i class="b"></i></div><div class="foot"><span class="nm">p009.jpg</span><span class="badge mute">Detected</span></div></div>
        </div>
        <div class="sheet">
          <div class="grab"></div>
          <div style="font-size:12px;margin-bottom:8px">^ Bottom-sheet editor — geser, snap 40 / 70 / full</div>
          <div style="display:flex;gap:6px">
            <span class="btn pri sm" style="height:44px;flex:1;justify-content:center">Terjemahkan</span>
            <span class="btn def sm" style="height:44px">Simpan</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
